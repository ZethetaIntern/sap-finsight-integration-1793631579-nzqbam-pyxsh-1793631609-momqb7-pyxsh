openapi: 3.0.3
info:
  title: FinSight 4.2 Ingestion - MaterialCosts (DST006)
  version: 4.2.0
  description: 'Ingestion contract for Material Valuation & Costs in Zetheta FinSight
    4.2. [Assumed Contract: Standard Zetheta Ingestion Specification].'
paths:
  /inventory/material-costs/batch:
    post:
      summary: 'DST006: Ingest MaterialCosts batch'
      parameters:
      - name: X-Tenant-ID
        in: header
        required: true
        schema:
          type: string
      - name: X-Idempotency-Key
        in: header
        required: true
        schema:
          type: string
      responses:
        '201':
          description: MaterialCosts batch ingested successfully
