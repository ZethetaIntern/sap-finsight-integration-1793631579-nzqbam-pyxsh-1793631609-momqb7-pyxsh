openapi: 3.0.3
info:
  title: FinSight 4.2 Ingestion - FixedAssets (DST009)
  version: 4.2.0
  description: 'Ingestion contract for Fixed Asset Register in Zetheta FinSight 4.2.
    [Assumed Contract: Standard Zetheta Ingestion Specification].'
paths:
  /assets/register/batch:
    post:
      summary: 'DST009: Ingest FixedAssets batch'
      parameters:
      - name: X-Tenant-ID
        in: header
        required: true
        schema:
          type: string
      - name: X-Idempotency-Key
        in: header
        required: true
        schema:
          type: string
      responses:
        '201':
          description: FixedAssets batch ingested successfully
