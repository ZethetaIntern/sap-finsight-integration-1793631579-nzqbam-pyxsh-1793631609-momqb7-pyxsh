openapi: 3.0.3
info:
  title: FinSight 4.2 Ingestion - PurchaseOrders (DST007)
  version: 4.2.0
  description: 'Ingestion contract for Purchase Orders in Zetheta FinSight 4.2. [Assumed
    Contract: Standard Zetheta Ingestion Specification].'
paths:
  /procurement/purchase-orders/batch:
    post:
      summary: 'DST007: Ingest PurchaseOrders batch'
      parameters:
      - name: X-Tenant-ID
        in: header
        required: true
        schema:
          type: string
      - name: X-Idempotency-Key
        in: header
        required: true
        schema:
          type: string
      responses:
        '201':
          description: PurchaseOrders batch ingested successfully
