openapi: 3.0.3
info:
  title: FinSight 4.2 Ingestion - ProfitCentres (DST005)
  version: 4.2.0
  description: 'Ingestion contract for Profit Centre Margins in Zetheta FinSight 4.2.
    [Assumed Contract: Standard Zetheta Ingestion Specification].'
paths:
  /controlling/profit-centres/batch:
    post:
      summary: 'DST005: Ingest ProfitCentres batch'
      parameters:
      - name: X-Tenant-ID
        in: header
        required: true
        schema:
          type: string
      - name: X-Idempotency-Key
        in: header
        required: true
        schema:
          type: string
      responses:
        '201':
          description: ProfitCentres batch ingested successfully
