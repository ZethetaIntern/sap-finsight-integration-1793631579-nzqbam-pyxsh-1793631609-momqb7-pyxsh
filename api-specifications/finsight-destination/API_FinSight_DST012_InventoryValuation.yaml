openapi: 3.0.3
info:
  title: FinSight 4.2 Ingestion - InventoryValuation (DST012)
  version: 4.2.0
  description: 'Ingestion contract for Inventory Balances in Zetheta FinSight 4.2.
    [Assumed Contract: Standard Zetheta Ingestion Specification].'
paths:
  /inventory/balances/batch:
    post:
      summary: 'DST012: Ingest InventoryValuation batch'
      parameters:
      - name: X-Tenant-ID
        in: header
        required: true
        schema:
          type: string
      - name: X-Idempotency-Key
        in: header
        required: true
        schema:
          type: string
      responses:
        '201':
          description: InventoryValuation batch ingested successfully
