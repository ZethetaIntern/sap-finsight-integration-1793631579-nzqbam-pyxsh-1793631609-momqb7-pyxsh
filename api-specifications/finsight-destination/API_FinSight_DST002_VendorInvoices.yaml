openapi: 3.0.3
info:
  title: FinSight 4.2 Ingestion - VendorInvoices (DST002)
  version: 4.2.0
  description: 'Ingestion contract for Vendor Invoices in Zetheta FinSight 4.2. [Assumed
    Contract: Standard Zetheta Ingestion Specification].'
paths:
  /payables/invoices/batch:
    post:
      summary: 'DST002: Ingest VendorInvoices batch'
      parameters:
      - name: X-Tenant-ID
        in: header
        required: true
        schema:
          type: string
      - name: X-Idempotency-Key
        in: header
        required: true
        schema:
          type: string
      responses:
        '201':
          description: VendorInvoices batch ingested successfully
