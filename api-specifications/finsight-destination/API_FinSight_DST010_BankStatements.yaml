openapi: 3.0.3
info:
  title: FinSight 4.2 Ingestion - BankStatements (DST010)
  version: 4.2.0
  description: 'Ingestion contract for Bank Cash Positions in Zetheta FinSight 4.2.
    [Assumed Contract: Standard Zetheta Ingestion Specification].'
paths:
  /treasury/cash-positions/batch:
    post:
      summary: 'DST010: Ingest BankStatements batch'
      parameters:
      - name: X-Tenant-ID
        in: header
        required: true
        schema:
          type: string
      - name: X-Idempotency-Key
        in: header
        required: true
        schema:
          type: string
      responses:
        '201':
          description: BankStatements batch ingested successfully
