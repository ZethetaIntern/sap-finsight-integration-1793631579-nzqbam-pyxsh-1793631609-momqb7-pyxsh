openapi: 3.0.3
info:
  title: FinSight 4.2 Ingestion - JournalEntries (DST001)
  version: 4.2.0
  description: 'Ingestion contract for General Ledger Journal Entries in Zetheta FinSight
    4.2. [Assumed Contract: Standard Zetheta Ingestion Specification].'
paths:
  /financial/journal-entries/batch:
    post:
      summary: 'DST001: Ingest JournalEntries batch'
      parameters:
      - name: X-Tenant-ID
        in: header
        required: true
        schema:
          type: string
      - name: X-Idempotency-Key
        in: header
        required: true
        schema:
          type: string
      responses:
        '201':
          description: JournalEntries batch ingested successfully
