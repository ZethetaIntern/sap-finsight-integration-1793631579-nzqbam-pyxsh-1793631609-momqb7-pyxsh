openapi: 3.0.3
info:
  title: SAP S/4HANA Source - BankStatements (SRC010)
  version: 1.0.0
  description: Source extraction contract for Electronic Bank Statements backed by
    SAP table(s) FEBKO_FEBEP.
paths:
  /ZZ_FI_BL_CDS/BankStatements:
    get:
      summary: 'SRC010: Extract BankStatements'
      parameters:
      - name: $filter
        in: query
        schema:
          type: string
      - name: $skiptoken
        in: query
        schema:
          type: string
      - name: $top
        in: query
        schema:
          type: integer
          default: 5000
      responses:
        '200':
          description: Successful extraction of BankStatements records
