openapi: 3.0.3
info:
  title: SAP S/4HANA Source - Inventory (SRC012)
  version: 1.0.0
  description: Source extraction contract for Inventory Storage Location Balances
    backed by SAP table(s) MARD_MBEW.
paths:
  /ZZ_MM_INV_CDS/InventoryItems:
    get:
      summary: 'SRC012: Extract Inventory'
      parameters:
      - name: $filter
        in: query
        schema:
          type: string
      - name: $skiptoken
        in: query
        schema:
          type: string
      - name: $top
        in: query
        schema:
          type: integer
          default: 5000
      responses:
        '200':
          description: Successful extraction of Inventory records
