openapi: 3.0.3
info:
  title: SAP S/4HANA Source - ProfitCentre (SRC005)
  version: 1.0.0
  description: Source extraction contract for Profit Centre Master Data backed by
    SAP table(s) CEPC.
paths:
  /ZZ_FIN_PCA_CDS/ProfitCentres:
    get:
      summary: 'SRC005: Extract ProfitCentre'
      parameters:
      - name: $filter
        in: query
        schema:
          type: string
      - name: $skiptoken
        in: query
        schema:
          type: string
      - name: $top
        in: query
        schema:
          type: integer
          default: 5000
      responses:
        '200':
          description: Successful extraction of ProfitCentre records
