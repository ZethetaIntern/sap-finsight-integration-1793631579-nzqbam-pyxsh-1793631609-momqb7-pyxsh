openapi: 3.0.3
info:
  title: SAP S/4HANA Source - MaterialLedger (SRC006)
  version: 1.0.0
  description: Source extraction contract for Material Valuation & Costs backed by
    SAP table(s) MBEW_CKMLCR.
paths:
  /ZZ_FIN_ML_CDS/MaterialValuations:
    get:
      summary: 'SRC006: Extract MaterialLedger'
      parameters:
      - name: $filter
        in: query
        schema:
          type: string
      - name: $skiptoken
        in: query
        schema:
          type: string
      - name: $top
        in: query
        schema:
          type: integer
          default: 5000
      responses:
        '200':
          description: Successful extraction of MaterialLedger records
